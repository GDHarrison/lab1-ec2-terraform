name: Deploy EC2 Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get EC2 Public IP
        id: ec2
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=lab1-terraform-web-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Save SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Copy Website To EC2
        run: |
          scp -o StrictHostKeyChecking=no \
          -i private_key.pem \
          website/index.html \
          ec2-user@${{ steps.ec2.outputs.public_ip }}:/tmp/index.html

      - name: Deploy Website On EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i private_key.pem \
          ec2-user@${{ steps.ec2.outputs.public_ip }} \
          "sudo mv /tmp/index.html /var/www/html/index.html"